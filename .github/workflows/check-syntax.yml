name: Validar sintaxis de index.html

on:
  pull_request:
    paths:
      - 'index.html'
      - 'spot-shift-import.js'
      - 'scripts/check-html-syntax.mjs'
      - 'scripts/test-spot-shift-import.mjs'
      - 'scripts/test-turnos-query.mjs'
      - '.github/workflows/check-syntax.yml'
  workflow_dispatch: {}

jobs:
  check-syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar sintaxis de los <script> inline
        run: node scripts/check-html-syntax.mjs

      - name: Validar lector de calendario y regresiones de turnos
        run: |
          node --check spot-shift-import.js
          node scripts/test-spot-shift-import.mjs
          node scripts/test-turnos-query.mjs
